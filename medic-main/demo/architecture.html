<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Medic — System flow</title>
  <link rel="stylesheet" href="scenes.css">
  <script src="fit.js" defer></script>
</head>
<body>
  <main class="scene architecture" aria-label="Medic system flow and responsibilities">
    <h1 class="eyebrow"><span class="brand">MEDIC</span><span class="slash">/</span>SYSTEM FLOW</h1>
    <div class="system">
      <ol class="system-flow">
        <li>CALL</li>
        <li class="voice">GUAVA VOICE RUNTIME</li>
        <li>STRUCTURED ENCOUNTER</li>
        <li class="validation">DETERMINISTIC VALIDATION</li>
        <li class="review">CLINICIAN REVIEW</li>
      </ol>
      <div class="system-roles">
        <dl class="system-role language"><dt>LANGUAGE</dt><dd>AI</dd></dl>
        <dl class="system-role rules"><dt>DOCUMENTATION RULES</dt><dd>CODE</dd></dl>
        <dl class="system-role clinician"><dt>CLINICAL INFORMATION</dt><dd>CLINICIAN</dd></dl>
      </div>
    </div>
  </main>
</body>
</html>
